# fly.toml app configuration file generated for dance-studio-api on 2026-05-03T13:34:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dance-studio-api'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
